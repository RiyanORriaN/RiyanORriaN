<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="0.5" stop-color="#8E7CF8"/>
      <stop offset="1" stop-color="#F86FB2"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="type">
      <rect x="0" y="0" width="0" height="260">
        <animate attributeName="width" from="0" to="900" begin="0.8s" dur="1.2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Hi there! -->
  <text x="450" y="60" text-anchor="middle" font-family="Verdana, sans-serif" font-size="32" font-weight="600" fill="#36BCF7" opacity="0">
    Hi there!
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze"/>
    <animate attributeName="y" from="80" to="60" dur="0.6s" fill="freeze"/>
  </text>

  <!-- I'm Riyan (typed reveal) -->
  <g clip-path="url(#type)">
    <text x="450" y="140" text-anchor="middle" font-family="Verdana, sans-serif" font-size="68" font-weight="800" fill="url(#g)">I'm Riyan,</text>
  </g>

  <!-- Blinking cursor -->
  <rect x="690" y="88" width="4" height="60" fill="#36BCF7" opacity="0">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtitle -->
  <text x="450" y="192" text-anchor="middle" font-family="Verdana, sans-serif" font-size="22" fill="#8b949e" opacity="0">
    a software developer specializing in
    <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.7s" fill="freeze"/>
  </text>
  <text x="450" y="224" text-anchor="middle" font-family="Verdana, sans-serif" font-size="22" fill="#8b949e" opacity="0">
    both software and game development.
    <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.7s" fill="freeze"/>
  </text>

  <!-- Underline draw -->
  <line x1="250" y1="245" x2="650" y2="245" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-dasharray="400" stroke-dashoffset="400">
    <animate attributeName="stroke-dashoffset" from="400" to="0" begin="3.4s" dur="1s" fill="freeze"/>
  </line>
</svg>
